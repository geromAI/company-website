spring.application.name=company-website

#Messages Configuration
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

#Database Configuration
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#Cloud DATABASE
#spring.datasource.url=jdbc:mysql://:3306/
#spring.datasource.url=jdbc:mysql://:3306/ ?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
#spring.datasource.username=
#spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true

# Email Configuration
#### Microsoft email #####
#spring.mail.host=smtp.office365.com
#spring.mail.port=587
#spring.mail.username=
#spring.mail.password=

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# OneDrive Configuration
onedrive.clientId=
onedrive.clientSecret=
onedrive.tenantId=

onedrive.driveId=
onedrive.folderId=
onedrive.deletedContractsFolderId =

# file configurations
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=200MB
spring.servlet.multipart.file-size-threshold=2MB
server.tomcat.max-part-count=2000

