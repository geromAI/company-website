<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>geromAI — Coming Soon</title>

    <meta name="description"
          content="geromAI is currently building something new. Where Identity Becomes Innovation.">

    <meta name="robots"
          content="noindex, nofollow">

    <meta name="theme-color"
          content="#020817">

    <link rel="icon"
          type="image/svg+xml"
          href="@/src/main/resources/static/images/geromAI_logo_v2.svg">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="/src/main/resources/static/css/index.css">

</head>


<body>

<main class="coming-soon">

    <!-- Background -->

    <div class="background-grid"></div>

    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>
    <div class="background-glow glow-three"></div>


    <!-- Main content -->

    <div class="coming-soon-container">


        <!-- Logo -->

        <div class="logo-scene">

            <div class="logo-glow"></div>

            <div class="orbit orbit-one"></div>
            <div class="orbit orbit-two"></div>

            <span class="orbit-node node-one"></span>
            <span class="orbit-node node-two"></span>
            <span class="orbit-node node-three"></span>

            <img th:src="@{/images/geromAI_logo_v2.svg}"
                 class="geromai-icon"
                 alt="geromAI">

        </div>


        <!-- Status -->

        <div class="status">

            <span class="status-dot"></span>

            <span>
                BUILD IN PROGRESS
            </span>

        </div>


        <!-- Brand -->

        <img th:src="@{/images/geromAI_inline_logo_v2.svg}"
             class="geromai-logo"
             alt="geromAI">


        <!-- Heading -->

        <h1>
            Something new is
            <span>taking shape.</span>
        </h1>


        <!-- Description -->

        <p class="description">
            We're building the next chapter of geromAI.
            A new digital experience is on its way.
        </p>


        <!-- Progress -->

        <div class="build-progress">

            <div class="progress-info">

                <span>GEROMAI</span>

                <span>BUILDING</span>

            </div>

            <div class="progress-track">

                <div class="progress-bar"></div>

            </div>

        </div>


        <!-- Slogan -->

        <div class="slogan">

            <span></span>

            <p>
                Where Identity Becomes Innovation.
            </p>

            <span></span>

        </div>

    </div>

</main>

</body>

</html>
